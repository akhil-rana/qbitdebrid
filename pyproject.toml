[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qbitdebrid"
version = "0.1.0"
description = "qBitdebrid: Local automation daemon transforming qBittorrent into a high-speed HTTP download manager backed by TorBox"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "OpenCode Team"}
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "qbittorrent-api>=2023.12.30",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.0.0",
]

[tool.setuptools]
packages = ["qbitdebrid"]

[tool.setuptools.package-dir]
"qbitdebrid" = "src"
